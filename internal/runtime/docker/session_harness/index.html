<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Session · PillDrops</title><style>
:root{--paper:#f7f5f0;--ink:#141310;--green:#0c8a56;--red:#b3341f;--amber:#e9a319;--r:2px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:15px/1.6 "JetBrains Mono",ui-monospace,Menlo,monospace;padding:34px 18px 70px}
.wrap{max-width:780px;margin:0 auto}
header{border:2px solid var(--ink);border-radius:var(--r);padding:18px 22px;background:#fff;margin-bottom:16px}
h1{font-size:19px;letter-spacing:-.4px}.sub{font-size:12px;opacity:.7}
.state{display:inline-block;font-weight:700;font-size:12px;padding:3px 12px;border:2px solid var(--ink);border-radius:var(--r);margin-top:8px}
.state.run{background:var(--amber)}.state.done-g{background:var(--green);color:#fff;border-color:var(--green)}
.state.done-r{background:var(--red);color:#fff;border-color:var(--red)}.state.q{background:#fff}
ul{list-style:none;border:2px solid var(--ink);border-radius:var(--r);background:#fff;margin-bottom:16px}
li{padding:11px 16px;border-bottom:1px dashed rgba(20,19,16,.3);font-size:13.5px;display:flex;gap:12px;align-items:center}
li:last-child{border-bottom:0}
.ic{width:22px;text-align:center;font-weight:700}
.pass .ic{color:var(--green)}.fail .ic{color:var(--red)}.pend{opacity:.45}
.run .ic{animation:spin 1.2s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
video{width:100%;max-width:380px;border:2px solid var(--ink);border-radius:var(--r);background:#000;display:block;margin:8px 0 16px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:22px 0 10px}
img.shot{max-width:220px;border:2px solid var(--ink);border-radius:var(--r)}
pre{background:#131210;color:#f4f1e8;border-radius:var(--r);padding:14px 16px;font-size:12px;overflow-x:auto;border:2px solid var(--ink);max-height:340px;overflow-y:auto}
.hint{font-size:12px;opacity:.7;margin-top:10px}
a{color:var(--green)}
code{background:#fff;border:1px solid rgba(20,19,16,.3);border-radius:var(--r);padding:0 5px;font-size:12px}
</style></head><body><div class="wrap">
<header><h1>▣ PillDrops · Mobile Test Session</h1>
<div class="sub" id="dev">…</div><span class="state q" id="state">CONNECTING</span></header>
<div class="hint" id="qhint" style="display:none">Waiting for a test script. Push one with <code>pilldrops test ./mytest.sh</code> — or drop it at <code>/test/run.sh</code> yourself (exec or cp). It runs automatically, screen-recorded; this page becomes the report.</div>
<ul id="steps"><li class="pend"><span class="ic">·</span>connecting to session…</li></ul>
<div id="logwrap" style="display:none"><h2>Live log</h2><pre id="log"></pre></div>
<div id="result"></div>
</div><script>
const $=id=>document.getElementById(id);
function render(s){
  $('dev').textContent=s.device||'';
  const st=$('state');
  $('qhint').style.display=s.state==='queued'?'':'none';
  if(s.state==='running'){st.textContent='RUNNING';st.className='state run';}
  else if(s.state==='done'){st.textContent=s.verdict==='GREEN'?'PASSED':'FAILED';st.className='state '+(s.verdict==='GREEN'?'done-g':'done-r');}
  else{st.textContent='WAITING FOR TEST';st.className='state q';}
  $('steps').innerHTML=(s.steps&&s.steps.length?s.steps:[{n:'waiting for test script…',s:'pend'}]).map(x=>{
    const ic=x.s==='pass'?'✓':x.s==='fail'?'✗':x.s==='run'?'◐':'·';
    return `<li class="${x.s}"><span class="ic">${ic}</span>${x.n}</li>`}).join('');
  if(s.state==='done'){
    const vids=(s.videos||[]).map(v=>`<video controls src="${v}"></video>`).join('');
    const shots=(s.shots||[]).map(p=>`<a href="${p}"><img class="shot" src="${p}"></a>`).join(' ');
    const arts=(s.artifacts||[]).map(a=>`<a href="artifacts/${a}">${a}</a>`).join(' · ');
    $('result').innerHTML=`${vids?'<h2>Session recording</h2>'+vids:''}
      ${shots?'<h2>Final screenshot</h2>'+shots:''}
      ${arts?'<h2>Artifacts</h2><p style="font-size:13px">'+arts+'</p>':''}
      <h2>Exit code</h2><p style="font-size:13px">${s.exit} — <a href="run.log">full run.log</a></p>`;
  }
}
async function pollLog(state){
  if(state!=='running'&&state!=='done')return;
  try{const t=await (await fetch('run.log?t='+Date.now())).text();
    $('logwrap').style.display='';
    const lines=t.split('\n');$('log').textContent=lines.slice(-40).join('\n')||'(no output yet)';
    if(state==='running')$('log').scrollTop=$('log').scrollHeight;
  }catch(e){}
}
async function tick(){
  let s={state:'queued'};
  try{s=await (await fetch('status.json?t='+Date.now())).json();}catch(e){}
  render(s);await pollLog(s.state);
  if(s.state!=='done')setTimeout(tick,2500);
}
tick();
</script></body></html>
