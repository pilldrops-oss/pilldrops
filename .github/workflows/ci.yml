name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege, declared explicitly. Without this block a workflow inherits
# the repository's DEFAULT token permissions, which on many repos is
# read/write on everything — so a compromised third-party action in any step
# below could push commits or publish releases. CI only ever reads the tree.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # golangci-lint run ./... is clean; keep it that way — lint gates.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
      # Third-party actions stay pinned to a commit SHA and every workflow keeps
      # an explicit permissions block. Without this the next workflow anyone
      # adds floats again — `uses: actions/checkout@v4` is what every example
      # says. See scripts/actions-pin-guard.sh.
      - name: GitHub Actions are pinned and least-privilege
        run: ./scripts/actions-pin-guard.sh
      # Three files hand-write a [Service] block for the same binary. A
      # directive added to one is invisible in the other two — which is exactly
      # how packaging/sandboxd.service ended up as the only writer that never
      # set SANDBOXD_PRODUCTION, leaving four fail-closed guards inert on the
      # deployment shape this repository is published for.
      - name: Every sandboxd unit writer is hardened
        run: ./scripts/unit-hardening-guard.sh

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks scans commit history; it needs full history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Use the latest 1.25.x patch so the standard library carries current
          # security fixes (govulncheck flags reachable stdlib CVEs otherwise).
          go-version: '1.25'
      # govulncheck, gosec, staticcheck and osv-scanner, gated on NEW findings
      # against scripts/security-baseline.txt. Four tools rather than one
      # because they answer different questions and the difference matters:
      # govulncheck is call-graph aware and says "you are exploitable today",
      # osv-scanner is module-graph level and says "you are one call away",
      # gosec reads the code, staticcheck reads its semantics.
      #
      # A baseline rather than "must be zero": the tree HAS findings — seven
      # advisories in transitively-required modules that nothing calls — and a
      # gate that demands zero on a tree that has some is a gate somebody turns
      # off. The baseline's header records what was reviewed and why each entry
      # is there; scripts/security-scan.sh explains the rest.
      #
      # Exit 2 means the scan could NOT run (offline runner, no toolchain).
      # That is deliberately distinct from exit 1 "found something new" and
      # from exit 0 "clean" — the whole class of bug this repository keeps
      # meeting is a check that reports success without touching the property.
      # Same convention as the release-signature gate in the test job below.
      - name: Static + dependency scan (govulncheck, gosec, staticcheck, osv-scanner)
        run: |
          set -o pipefail
          ./scripts/security-scan.sh; rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::security-scan SKIPPED — a scanner could not run on this runner"
            exit 0
          fi
          exit "$rc"
      # The CLI rather than gitleaks-action: the action demands a paid license
      # for organisation repositories and fails before scanning. Pinned by
      # version and checksum, like the actions above are pinned by SHA.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .

  test:
    name: Test
    runs-on: ubuntu-latest
    # Redis is what makes the HA tests real. Without it the shared node table
    # and route catalog fall back to their in-memory implementations, and the
    # Redis-backed subtests SKIP — so the control plane's whole
    # multiple-replicas story would be untested while CI stayed green. The
    # in-memory pair still runs everywhere; this is the half that catches
    # serialization and cross-process bugs.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # Postgres is what makes the STORE tests real, and the argument is the
      # one made for Redis above, applied to the database the control plane
      # actually runs on. Without it every Postgres-backed store test SKIPs:
      # the dialect split, the migrations' postgres statements, the advisory
      # migration lock and the admission race all go untested while CI stays
      # green, and only SQLite — the single-binary path — is ever exercised.
      #
      # That was not hypothetical. Measured 2026-09-07: the suite had 17
      # failures on Postgres and none on SQLite, and had clearly not been run
      # against Postgres in a long time, because nothing here ran it.
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sandboxd_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SANDBOXD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      SANDBOXD_TEST_POSTGRES_URL: postgres://postgres:ci@127.0.0.1:5432/sandboxd_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
      - name: Run tests
        # 30m, not the 10m default: internal/httpapi opens a migrated store per
        # test, which under -race on a two-core runner takes past ten minutes.
        run: go test -race -timeout 30m -coverprofile=coverage.out ./...
      # A package whose test files are all excluded by a build constraint prints
      # "[no test files]" and the suite above still says ok. internal/vm — the
      # VM lifecycle, jailer wiring, overlay sizing and the per-sandbox storage
      # cap — is entirely //go:build linux, so on a developer's macOS machine
      # nine test files run as zero and report success. This job runs on Linux
      # so they DO execute here; the check exists so a future build constraint
      # cannot quietly remove them from CI as well.
      - name: No package with tests may silently run none
        run: ./scripts/no-silent-skips.sh
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out
      # A RATCHET, not a target. Floors sit a few points under what each package
      # measured when it was added, so ordinary drift passes and a deleted
      # boundary test fails. Only the packages where losing a test loses a
      # security property are gated — see the script for why each is on the list.
      #
      # Runs here rather than in its own job because internal/runtime/docker's
      # live tests need a Docker daemon, which this runner has and a bare
      # container would not.
      - name: Coverage floors
        run: ./scripts/coverage-gate.sh

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The stale-bundle guard below diffs against the merge base, so it
          # needs history rather than a shallow clone.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm exec tsc --noEmit
      - name: Lint
        working-directory: web
        run: pnpm exec eslint . --max-warnings 80
      - name: Test
        working-directory: web
        run: pnpm test

      # internal/webui/dist is TRACKED and embedded into the portal binary via
      # //go:embed all:dist, and is regenerated only by `make web`. A change to
      # web/src that ships without a rebuild is invisible in every test and
      # silently reverts the dashboard in production — it happened once and cost
      # a whole phase of work.
      #
      # This compares changed paths rather than rebuilding and byte-diffing:
      # node/pnpm are not pinned tightly enough for a rebuilt bundle to be
      # reproducible across machines, so a byte-compare would fail on toolchain
      # drift rather than on the mistake we care about.
      - name: Guard against a stale embedded bundle
        run: |
          set -euo pipefail
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit — skipping the stale-bundle guard."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          # Test files are never bundled, so touching one must not demand a rebuild.
          SRC=$(echo "$CHANGED" | grep -E '^web/(src|index\.html|vite\.config\.ts|package\.json)' | grep -vE '\.test\.tsx?$' || true)
          DIST=$(echo "$CHANGED" | grep -E '^internal/webui/dist/' || true)
          if [ -n "$SRC" ] && [ -z "$DIST" ]; then
            echo "::error::Dashboard source changed but internal/webui/dist was not rebuilt."
            echo "The portal embeds internal/webui/dist via //go:embed, so these changes"
            echo "would NOT reach users. Run 'make web' and commit the result."
            echo ""
            echo "Changed source files:"
            echo "$SRC" | sed 's/^/  /'
            exit 1
          fi
          echo "Bundle guard OK (src changed: $([ -n "$SRC" ] && echo yes || echo no), dist changed: $([ -n "$DIST" ] && echo yes || echo no))"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
      - name: Build sandboxd
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/sandboxd-linux ./cmd/sandboxd/
      - name: Build sandboxd-fleet
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/sandboxd-fleet-linux ./cmd/sandboxd-fleet/
      # The same binary with the optional product packages compiled out. Not a
      # deploy artifact — it is built here so the tier-boundary rule below has a
      # tagged closure to check, and so a change that couples the runtime core to
      # a feature package fails in CI rather than the next time someone tries the
      # tag. See the Makefile's sandboxd-core target.
      - name: Build sandboxd-fleet (-tags core)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags core -o bin/sandboxd-fleet-core ./cmd/sandboxd-fleet/
      # Control plane / node / in-guest must stay separate. One script, run
      # identically here and in release.yml, so the rule cannot drift between
      # the two. See scripts/tier-boundary-guard.sh for what each rule protects.
      #
      # Placed after BOTH builds on purpose: the script's checktags rule reads
      # the tagged closure, so running it before the tagged build would still
      # pass, and the step order would then be describing a check that had not
      # been exercised against the artifact CI actually produces.
      - name: Tier boundary guard
        run: ./scripts/tier-boundary-guard.sh
      # The core build must also PASS ITS OWN TESTS, not merely link. A no-op
      # registrar sibling that mounts the wrong set, or a core route whose
      # handler moved behind the tag, links perfectly and 404s at runtime — see
      # internal/httpapi/routesplit_core_test.go.
      - name: Test (-tags core)
        run: go test -tags core ./internal/httpapi/ ./internal/nodeboot/
      - name: Build orchestrator
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/orchestrator ./cmd/orchestrator/
      - name: Build envd
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/envd ./cmd/envd/
      - name: Verify binaries
        run: ls -lh bin/
