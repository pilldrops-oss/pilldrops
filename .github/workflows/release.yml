name: Release sandboxd

on:
  push:
    tags: ['sandboxd/v*']

permissions:
  # AUDITED (4.7): `contents: write` is required — `gh release create` at the
  # last step publishes the release and its assets, and nothing narrower can do
  # that. It is scoped to this workflow, which only runs on a sandboxd/v* tag.
  contents: write
  # Keyless signing: cosign exchanges this OIDC token for a short-lived Sigstore
  # certificate binding the signature to THIS workflow in THIS repository. No
  # private key exists to leak, rotate, or store as a secret.
  id-token: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the tag can be checked against main.
          fetch-depth: 0
      # Releases are cut from main only: a tag on any other commit publishes nothing.
      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
      # The binaries embed the dashboard (go:embed all:dist); it is build
      # output, not committed, so build it before anything compiles it in.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build dashboard
        run: make web
      - name: Run tests
        run: go test -race -timeout 30m ./...
      # Control plane / node / in-guest must stay separate. One script, run
      # identically here and in release.yml, so the rule cannot drift between
      # the two. See scripts/tier-boundary-guard.sh for what each rule protects.
      - name: Tier boundary guard
        run: ./scripts/tier-boundary-guard.sh
      # No -tags here, and specifically not `dev`. The process runtime provides
      # no tenant boundary and is behind //go:build dev at nodeboot's selector,
      # so an untagged build does not contain it —
      # TestAReleaseBinaryContainsNoUnisolatedRuntime asserts that against the
      # link closure, and the `go test ./...` step above is what runs it. Adding
      # a tag here would ship a binary that can execute customer code as bare
      # host processes.
      # The installer puts this CLI on the host and inside every sandbox.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pilldrops-oss/pilldrops-cli
          path: cli
      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME#sandboxd/}"
          # NOTE: the -X path embeds the module path — if nodeboot ever moves modules (phase-3 extraction), update this or stamping silently no-ops.
          LDFLAGS="-s -w -X github.com/pilldrops-oss/pilldrops/internal/nodeboot.Version=${VERSION}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/sandboxd-linux-amd64 ./cmd/sandboxd/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/sandboxd-fleet-linux-amd64 ./cmd/sandboxd-fleet/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/envd-linux-amd64 ./cmd/envd/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/orchestrator-linux-amd64 ./cmd/orchestrator/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/pilldrops-join-linux-amd64 ./cmd/pilldrops-join/
          (cd cli && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o ../dist/pilldrops-linux-amd64 ./cmd/pilldrops)
          (cd dist && sha256sum sandboxd-linux-amd64 sandboxd-fleet-linux-amd64 envd-linux-amd64 orchestrator-linux-amd64 pilldrops-join-linux-amd64 pilldrops-linux-amd64 > SHA256SUMS)
          ls -lh dist/

      # SHA256SUMS alone proves nothing an attacker could not also produce:
      # whoever can replace a binary in a release can replace the checksum file
      # beside it. The signature is what makes the checksums worth having,
      # because it cannot be reissued without this repository's OIDC identity.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign the checksums
        run: |
          cd dist
          # Sign SHA256SUMS rather than each binary: one signature covers every
          # binary, and verifying it then checking the hashes is the same
          # guarantee with one fewer artifact to handle.
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      # An SBOM answers "what is actually in this binary" for someone deciding
      # whether to run it on their own hardware. Generated from the source tree
      # so it covers the vendored dependencies that get linked.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#sandboxd/}"
          gh release create "$GITHUB_REF_NAME" \
            dist/sandboxd-linux-amd64 dist/sandboxd-fleet-linux-amd64 dist/envd-linux-amd64 dist/orchestrator-linux-amd64 dist/pilldrops-join-linux-amd64 dist/pilldrops-linux-amd64 \
            dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.pem dist/sbom.spdx.json \
            --title "sandboxd ${VERSION}" \
            --notes "sandboxd node release ${VERSION}. Install on a node: \`sudo sandboxd-update ${VERSION}\` (fleet variant by default). VERIFY FIRST — SHA256SUMS alone proves nothing, since whoever can swap a binary can swap the checksums beside it; the Sigstore signature cannot be reissued without this repo's release-workflow identity. Run \`scripts/verify-release.sh <download-dir>\`, or see docs/releases.md. Assets: sandboxd-fleet-linux-amd64 (minimal node agent), sandboxd-linux-amd64 (full standalone), envd-linux-amd64 (in-guest agent, kept in sync with sandboxd), orchestrator-linux-amd64 (control plane), pilldrops-join-linux-amd64 (joins a host to a fleet), SHA256SUMS + .sig + .pem, sbom.spdx.json."
